# Minimal TR-181 acceptance profile with Connection-Request listener
# enabled. Daemon-mode trigger.
#
# Post-fix (cpe-labs-context #20), cpe-sim publishes the bound CR URL
# into the tree AFTER listener.Start, so the bootstrap Inform's
# ParameterList carries the correct URL. The acceptance scenario
# reads that value out of the captured Inform and uses it for the
# subsequent digest GET — no need to pre-pick a port.
#
# throttleWindow: 0s because the test issues exactly one CR; throttle
# behavior is covered by unit tests.

deviceIdPaths:
  manufacturer: Device.DeviceInfo.Manufacturer
  oui:          Device.DeviceInfo.ManufacturerOUI
  productClass: Device.DeviceInfo.ProductClass
  serialNumber: Device.DeviceInfo.SerialNumber

connectionRequest:
  scheme: digest
  realm: cpe-labs-acceptance
  throttleWindow: 0s
  usernameParameter: Device.ManagementServer.ConnectionRequestUsername
  passwordParameter: Device.ManagementServer.ConnectionRequestPassword

fleet:
  count: 1
  serialPattern: "{base}"

informParameters:
  bootstrap:
    - Device.DeviceInfo.Manufacturer
    - Device.DeviceInfo.ManufacturerOUI
    - Device.DeviceInfo.ProductClass
    - Device.DeviceInfo.SerialNumber
    - Device.DeviceInfo.SoftwareVersion
    - Device.DeviceInfo.HardwareVersion
    - Device.ManagementServer.ConnectionRequestURL
  connectionRequest:
    - Device.DeviceInfo.SoftwareVersion
