name: release

on:
  release:
    types: [published]

permissions:
  contents: write   # Upload binaries to the GitHub Release.
  packages: write   # Push to GHCR (kept available even though primary push is Dockerhub).

jobs:
  binaries:
    name: Build binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Build cpe-sim
        env:
          GOOS:       ${{ matrix.goos }}
          GOARCH:     ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION:    ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist
          BIN_NAME="cpe-sim-${VERSION}-${GOOS}-${GOARCH}${{ matrix.ext }}"
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build \
            -trimpath \
            -ldflags "-s -w \
              -X github.com/herder-labs/cpe-labs/internal/version.Version=${VERSION} \
              -X github.com/herder-labs/cpe-labs/internal/version.Commit=${COMMIT} \
              -X github.com/herder-labs/cpe-labs/internal/version.Date=${DATE}" \
            -o "dist/${BIN_NAME}" \
            ./cmd/cpe-sim
          # SHA256 sidecar for verification.
          (cd dist && sha256sum "${BIN_NAME}" > "${BIN_NAME}.sha256")
          ls -la dist/

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

  docker:
    name: Build + push Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: herderlabs/cpe-sim
          # Tag flavors:
          #   herderlabs/cpe-sim:v0.1.0   (full tag)
          #   herderlabs/cpe-sim:0.1.0    (sans v)
          #   herderlabs/cpe-sim:0.1      (minor)
          #   herderlabs/cpe-sim:0        (major)
          #   herderlabs/cpe-sim:latest   (only on non-prerelease)
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
