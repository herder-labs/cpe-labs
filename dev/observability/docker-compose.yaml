# Standalone observability stack for validating cpe-sim's --metrics-bind-addr.
# Independent of any other compose project (Herder, agent-sim, etc).
#
#   docker compose -f dev/observability/docker-compose.yaml up -d
#
# Run cpe-sim on the host with --metrics-bind-addr=0.0.0.0:9100 and Prometheus
# in this stack will scrape it via host.docker.internal:9100. Grafana ships
# with a provisioned datasource and one dashboard ("cpe-sim").

services:
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: cpe-sim-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: cpe-sim-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ADMIN_PASSWORD: cpe-sim-dev
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3031:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prom-data:
  grafana-data:
