# EasyMesh extenders, legacy `Device.WiFi.MultiAP.*` subtree. This
# tree is `status="deleted"` in TR-181 issue 2 amendment 13+ — the
# canonical EasyMesh data model has been moved to
# `Device.WiFi.DataElements.Network.*` (see tr-181-2-20-1.xml line
# 21762+ for the new tree, line 21157 for the deletion marker on
# MultiAP). Production devices in the field still emit the legacy
# tree during the migration window, so the simulator keeps it as a
# representative shape, but new ACS-side scripts MUST consume
# DataElements.* and treat MultiAP.* as a fallback only.
#
# Object paths cannot themselves contain {i} (the loader appends it
# automatically), so nested instance dimensions are spelled out with
# literal indexes.
#
# All MACAddress / BSSID values must be valid 6-byte (12-hex-char)
# MACs per TR-181's `dataType ref="MACAddress"` typing. Earlier
# versions of this file used `{cpe:HEX:4}` (4 hex chars without
# colons) inside MAC strings, producing invalid 5-field MACs like
# "0E:E0:0001:01:00" — fixed below by switching to `{cpe:MAC:2}`
# (2-byte colon-separated fragment).

objects:
  - path: Device.WiFi.MultiAP.APDevice
    instances: 2
    parameters:
      - path: MACAddress
        value: "0E:E0:{cpe:MAC:2}:0{i}:00"
      - path: Manufacturer
        value: "Generic Networks"
      - path: ManufacturerOUI
        value: "AABBCC"
      - path: ModelName
        value: "GE-100"
      - path: SerialNumber
        value: "EXT-{cpe:04}-0{i}"
      - path: SoftwareVersion
        value: "1.0.0"
      - path: AssociatedDeviceNumberOfEntries
        type: xsd:unsignedInt
        value: "2"
      # SignalStrength is overridden per-instance in `groups:` below
      # so the demo has one healthy backhaul (APDevice.1) and one
      # degraded backhaul (APDevice.2). Defining it here as a
      # multi-instance template would force both extenders to share
      # one drift band and prevent the bad-link case from being
      # demonstrable.

  - path: Device.WiFi.MultiAP.APDevice.1.Radio
    instances: 2
    parameters:
      - path: Enable
        type: xsd:boolean
        value: "true"
      - path: OperatingFrequencyBand
        value: "2.4GHz"
      - path: Channel
        type: xsd:unsignedInt
        value: "11"
      - path: TransmitPower
        type: xsd:int
        value: "100"

  - path: Device.WiFi.MultiAP.APDevice.2.Radio
    instances: 2
    parameters:
      - path: Enable
        type: xsd:boolean
        value: "true"
      - path: OperatingFrequencyBand
        value: "5GHz"
      - path: Channel
        type: xsd:unsignedInt
        value: "36"
      - path: TransmitPower
        type: xsd:int
        value: "100"

  - path: Device.WiFi.MultiAP.APDevice.1.Radio.1.AP
    instances: 2
    parameters:
      - path: BSSID
        value: "0E:E1:{cpe:MAC:2}:01:0{i}"
      - path: SSID
        value: "Home-{cpe:HEX:4}-{i}"
      - path: AssociatedDeviceNumberOfEntries
        type: xsd:unsignedInt
        value: "2"

  - path: Device.WiFi.MultiAP.APDevice.1.Radio.2.AP
    instances: 2
    parameters:
      - path: BSSID
        value: "0E:E2:{cpe:MAC:2}:01:0{i}"
      - path: SSID
        value: "Home-{cpe:HEX:4}-5g-{i}"
      - path: AssociatedDeviceNumberOfEntries
        type: xsd:unsignedInt
        value: "1"

  - path: Device.WiFi.MultiAP.APDevice.2.Radio.1.AP
    instances: 2
    parameters:
      - path: BSSID
        value: "0E:E3:{cpe:MAC:2}:02:0{i}"
      - path: SSID
        value: "Home-{cpe:HEX:4}-{i}"
      - path: AssociatedDeviceNumberOfEntries
        type: xsd:unsignedInt
        value: "1"

  - path: Device.WiFi.MultiAP.APDevice.2.Radio.2.AP
    instances: 2
    parameters:
      - path: BSSID
        value: "0E:E4:{cpe:MAC:2}:02:0{i}"
      - path: SSID
        value: "Home-{cpe:HEX:4}-5g-{i}"
      - path: AssociatedDeviceNumberOfEntries
        type: xsd:unsignedInt
        value: "1"

  # Stations associated to extender-1 radio-1 AP-1 (2 clients).
  - path: Device.WiFi.MultiAP.APDevice.1.Radio.1.AP.1.AssociatedDevice
    instances: 2
    parameters:
      - path: MACAddress
        value: "0E:F1:{cpe:MAC:2}:11:0{i}"
      - path: SignalStrength
        type: xsd:int
        value: "-65"
        writable: true
        generator:
          type: drift
          interval: 30s
          min: -82
          max: -55
          stepMax: 3
      - path: LastDataDownlinkRate
        type: xsd:unsignedInt
        value: "72000"
      - path: LastConnectTime
        type: xsd:dateTime
        value: "2026-01-01T00:00:00Z"
        writable: true
        generator:
          type: wallclock
          interval: 1m

  # Stations associated to extender-1 radio-2 AP-1 (1 client).
  - path: Device.WiFi.MultiAP.APDevice.1.Radio.2.AP.1.AssociatedDevice
    instances: 1
    parameters:
      - path: MACAddress
        value: "0E:F2:{cpe:MAC:2}:12:0{i}"
      - path: SignalStrength
        type: xsd:int
        value: "-60"
        writable: true
        generator:
          type: drift
          interval: 30s
          min: -78
          max: -48
          stepMax: 3
      - path: LastDataDownlinkRate
        type: xsd:unsignedInt
        value: "433000"

  # Stations associated to extender-2 radio-1 AP-1 (1 client).
  - path: Device.WiFi.MultiAP.APDevice.2.Radio.1.AP.1.AssociatedDevice
    instances: 1
    parameters:
      - path: MACAddress
        value: "0E:F3:{cpe:MAC:2}:21:0{i}"
      - path: SignalStrength
        type: xsd:int
        value: "-72"
        writable: true
        generator:
          type: drift
          interval: 30s
          min: -85
          max: -60
          stepMax: 3
      - path: LastDataDownlinkRate
        type: xsd:unsignedInt
        value: "54000"

# Backhaul RSSI from each extender to the controller gateway. Driven
# per-instance so the topology panel demo has a clear contrast: a
# healthy backhaul on extender 1 (green band) and a degraded backhaul
# on extender 2 (red band). The topology enrichment script reads this
# value via `Device.WiFi.MultiAP.APDevice.{i}.SignalStrength` and
# attaches it to the gateway→extender edge as `rssi_dbm`.
groups:
  - prefix: Device.WiFi.MultiAP.APDevice.1
    parameters:
      - path: SignalStrength
        type: xsd:int
        value: "-55"
        writable: true
        generator:
          type: drift
          interval: 30s
          min: -68
          max: -48
          stepMax: 3

  - prefix: Device.WiFi.MultiAP.APDevice.2
    parameters:
      - path: SignalStrength
        type: xsd:int
        value: "-85"
        writable: true
        generator:
          type: drift
          interval: 30s
          min: -92
          max: -78
          stepMax: 3
