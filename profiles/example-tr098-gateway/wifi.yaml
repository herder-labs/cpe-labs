# WLAN: TR-098 conflates radio + SSID + AP into WLANConfiguration.
# Four WLANConfiguration instances (2.4 GHz main + guest, 5 GHz main
# + guest), each with its own AssociatedDevice table for the connected
# stations.
#
# Every AssociatedDevice table exposes the same leaf set so an ACS
# issuing wildcard GPVs (e.g. WLANConfiguration.*.AssociatedDevice.*.SignalStrength)
# never hits a per-WLAN schema gap that would 9005 the entire batch.

objects:
  - path: InternetGatewayDevice.LANDevice.1.WLANConfiguration
    instances: 4
    parameters:
      - path: Enable
        type: xsd:boolean
        value: "true"
        writable: true
      - path: Status
        value: "Up"
      - path: SSID
        value: "Home-{cpe:HEX:4}-{i}"
        writable: true
      - path: BSSID
        value: "00:11:22:{cpe:MAC:3}:{i}0"
      - path: Channel
        type: xsd:unsignedInt
        value: "6"
        writable: true
      - path: AutoChannelEnable
        type: xsd:boolean
        value: "true"
        writable: true
      - path: Standard
        value: "n"
      - path: BeaconType
        value: "WPA2"
      - path: BasicAuthenticationMode
        value: "None"
        writable: true
      - path: WPAEncryptionModes
        value: "AESEncryption"
        writable: true
      - path: IEEE11iEncryptionModes
        value: "AESEncryption"
        writable: true
      - path: SSIDAdvertisementEnabled
        type: xsd:boolean
        value: "true"
        writable: true
      - path: TransmitPower
        type: xsd:int
        value: "100"
        writable: true
      - path: TotalAssociations
        type: xsd:unsignedInt
        value: "3"
      - path: AssociatedDeviceNumberOfEntries
        type: xsd:unsignedInt
        value: "3"

  - path: InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.AssociatedDevice
    instances: 3
    parameters:
      - path: AssociatedDeviceMACAddress
        value: "0E:A1:{cpe:HEX:4}:01:0{i}"
      - path: AssociatedDeviceIPAddress
        value: "192.168.{cpe}.{i}1"
      - path: AssociatedDeviceAuthenticationState
        type: xsd:boolean
        value: "true"
      - path: LastDataTransmitRate
        value: "144"
      - path: SignalStrength
        type: xsd:int
        value: "-55"
        writable: true
        generator:
          type: drift
          interval: 30s
          min: -75
          max: -45
          stepMax: 3

  - path: InternetGatewayDevice.LANDevice.1.WLANConfiguration.2.AssociatedDevice
    instances: 4
    parameters:
      - path: AssociatedDeviceMACAddress
        value: "0E:A2:{cpe:HEX:4}:02:0{i}"
      - path: AssociatedDeviceIPAddress
        value: "192.168.{cpe}.{i}2"
      - path: AssociatedDeviceAuthenticationState
        type: xsd:boolean
        value: "true"
      - path: LastDataTransmitRate
        value: "300"
      - path: SignalStrength
        type: xsd:int
        value: "-58"
        writable: true
        generator:
          type: drift
          interval: 30s
          min: -78
          max: -48
          stepMax: 3

  - path: InternetGatewayDevice.LANDevice.1.WLANConfiguration.3.AssociatedDevice
    instances: 2
    parameters:
      - path: AssociatedDeviceMACAddress
        value: "0E:A3:{cpe:HEX:4}:03:0{i}"
      - path: AssociatedDeviceIPAddress
        value: "192.168.{cpe}.{i}3"
      - path: AssociatedDeviceAuthenticationState
        type: xsd:boolean
        value: "true"
      - path: LastDataTransmitRate
        value: "144"
      - path: SignalStrength
        type: xsd:int
        value: "-63"
        writable: true
        generator:
          type: drift
          interval: 30s
          min: -82
          max: -52
          stepMax: 3

  - path: InternetGatewayDevice.LANDevice.1.WLANConfiguration.4.AssociatedDevice
    instances: 1
    parameters:
      - path: AssociatedDeviceMACAddress
        value: "0E:A4:{cpe:HEX:4}:04:0{i}"
      - path: AssociatedDeviceIPAddress
        value: "192.168.{cpe}.{i}4"
      - path: AssociatedDeviceAuthenticationState
        type: xsd:boolean
        value: "true"
      - path: LastDataTransmitRate
        value: "433"
      - path: SignalStrength
        type: xsd:int
        value: "-67"
        writable: true
        generator:
          type: drift
          interval: 30s
          min: -85
          max: -55
          stepMax: 3

groups:
  - prefix: InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.Stats
    parameters:
      - path: BytesSent
        type: xsd:unsignedInt
        value: "0"
        writable: true
        generator:
          type: counter
          interval: 30s
          min: 0
          max: 4294967295
          step: 4000000
          jitter: 0.3
      - path: BytesReceived
        type: xsd:unsignedInt
        value: "0"
        writable: true
        generator:
          type: counter
          interval: 30s
